version: '3'
name: sdoa2
services:
  db:
    image: postgres:16
    container_name: sdoa2-postgres
    volumes:
      - database:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: 'postgres'
      POSTGRES_DB: sdoa2
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 5s
      retries: 15
  redis:
    image: redis
    container_name: sdoa2-redis
    ports:
      - '6379:6379'
    volumes:
      - redis:/data

volumes:
  database:
  redis:
